<div class="container mt-4">

  <div class="card">

    <div class="card-header bg-info">

      <h3 class="mb-0">
        Employee Information
      </h3>

    </div>

    <div class="card-body">

      @if (employee) {

        <div class="row mb-3">

          <div class="col-4">
            <strong>Employee ID</strong>
          </div>

          <div class="col-8">
            {{ employee.id }}
          </div>

        </div>

        <hr>

        <div class="row mb-3">

          <div class="col-4">
            <strong>Employee Name</strong>
          </div>

          <div class="col-8">
            {{ employee.name }}
          </div>

        </div>

        <hr>

        <div class="row mb-3">

          <div class="col-4">
            <strong>Designation</strong>
          </div>

          <div class="col-8">
            {{ employee.desg }}
          </div>

        </div>

        <hr>

        <button
          type="button"
          class="btn btn-primary"
          [routerLink]="[
            '/update',
            employee.id
          ]">
          Update
        </button>

        <button
          type="button"
          class="btn btn-secondary ms-2"
          routerLink="/list">
          Back
        </button>

      } @else {

        <div class="alert alert-danger">
          Employee not found.
        </div>

        <button
          type="button"
          class="btn btn-secondary"
          routerLink="/list">
          Back
        </button>

      }

    </div>

  </div>

</div>

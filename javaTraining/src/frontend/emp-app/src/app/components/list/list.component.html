<div class="container mt-4">

  <div class="card">

    <div class="card-header bg-primary text-white">

      <div class="d-flex justify-content-between align-items-center">

        <h3 class="mb-0">
          Employee List
        </h3>

        <button
          type="button"
          class="btn btn-light"
          routerLink="/add">
          Add Employee
        </button>

      </div>

    </div>

    <div class="card-body">

      @if (successMessage) {

        <div class="alert alert-success">

          {{ successMessage }}

          <button
            type="button"
            class="btn-close float-end"
            (click)="successMessage = ''">
          </button>

        </div>

      }

      @if (empList.length > 0) {

        <table class="table table-bordered table-striped">

          <thead class="table-dark">

            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Designation</th>
              <th>Actions</th>
            </tr>

          </thead>

          <tbody>

            @for (employee of empList; track employee.id) {

              <tr>

                <td>
                  {{ employee.id }}
                </td>

                <td>
                  {{ employee.name }}
                </td>

                <td>
                  {{ employee.desg }}
                </td>

                <td>

                  <button
                    type="button"
                    class="btn btn-primary btn-sm me-2"
                    [routerLink]="[
                      '/update',
                      employee.id
                    ]">
                    Update
                  </button>

                  <button
                    type="button"
                    class="btn btn-info btn-sm me-2"
                    [routerLink]="[
                      '/info',
                      employee.id ]">
                    Info
                  </button>

                  <button
                    type="button"
                    class="btn btn-danger btn-sm"
                    (click)="deleteEmployee(employee.id)">
                    Delete
                  </button>

                </td>

              </tr>

            }

          </tbody>

        </table>

      } @else {

        <div class="alert alert-warning text-center">
          No employees available.
        </div>

      }

    </div>

  </div>

</div>

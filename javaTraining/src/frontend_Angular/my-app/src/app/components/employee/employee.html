<div class="container d-flex justify-content-center align-items-center vh-100">
  <form class="border-0 p-4 p-md-5 rounded-4 shadow w-75 bg-white">
    <h2 class="text-center mb-1 text-primary fw-bold">Add Employee</h2>
    <p class="text-center text-muted mb-4">Enter employee details below</p>

    <div class="row mb-3 align-items-center">
      <label class="col-sm-3 col-form-label fw-semibold" for="eName">Employee Name</label>
      <div class="col-sm-9">
        <input
          type="text"
          class="form-control rounded-3"
          id="eName"
          name="ename"
          placeholder="Enter full name"
          [(ngModel)]="eName">
      </div>
    </div>

    <div class="row mb-3 align-items-center">
      <label class="col-sm-3 col-form-label fw-semibold" for="eId">Employee ID</label>
      <div class="col-sm-9">
        <input
          type="text"
          class="form-control rounded-3"
          id="eId"
          name="eid"
          placeholder="Enter employee ID"
          [(ngModel)]="eId">
      </div>
    </div>

    <div class="row mb-3 align-items-center">
      <label class="col-sm-3 col-form-label fw-semibold" for="salary">Salary</label>
      <div class="col-sm-9">
        <input
          type="number"
          class="form-control rounded-3"
          id="salary"
          name="salary"
          placeholder="Enter salary"
          [(ngModel)]="salary">
      </div>
    </div>

    <div class="row mb-3 align-items-center">
      <label class="col-sm-3 col-form-label fw-semibold" for="email">Email</label>
      <div class="col-sm-9">
        <input
          type="email"
          class="form-control rounded-3"
          id="email"
          name="email"
          placeholder="name@example.com"
          [(ngModel)]="email">
      </div>
    </div>

    <div class="row mb-4 align-items-center">
      <label class="col-sm-3 col-form-label fw-semibold" for="mobileNo">Mobile Number</label>
      <div class="col-sm-9">
        <input
          type="tel"
          class="form-control rounded-3"
          id="mobileNo"
          name="mobileNo"
          pattern="[0-9]{10}"
          placeholder="10-digit number"
          [(ngModel)]="mobileNo">
      </div>
    </div>

     <button
      type="button"
      class="btn btn-primary w-100 rounded-3 py-2 fw-semibold btn-hover"
      (click)="addEmployee()">
      Add Employee
    </button>
  </form>
</div>

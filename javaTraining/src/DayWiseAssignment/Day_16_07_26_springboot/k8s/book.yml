apiVersion: apps/v1
kind: Deployment
metadata:
  name: book-deployment
  labels:
    app: book-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: book-service
  template:
    metadata:
      labels:
        app: book-service
    spec:
      containers:
        - name: book-service
          image: hiteshpatwal/spring-boot-bookapp:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8085
          env:
            - name: MYSQL_HOST
              value: "mysql-service"
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: book-service
spec:
  selector:
    app: book-service
  ports:
    - port: 8085
      targetPort: 8085
      nodePort: 30085
  type: NodePort